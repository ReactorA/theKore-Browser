
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TheKore Browser</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
        overflow: hidden;
      }
      .font-mono {
        font-family: 'JetBrains+Mono', monospace;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(155, 155, 155, 0.3);
        border-radius: 10px;
      }
      
      /* RGB Border Animation for Cyber-Pulse */
      @keyframes rgb-border {
        0% { border-color: #00ffff; box-shadow: 0 0 10px #00ffff; }
        33% { border-color: #ff00ff; box-shadow: 0 0 10px #ff00ff; }
        66% { border-color: #ffff00; box-shadow: 0 0 10px #ffff00; }
        100% { border-color: #00ffff; box-shadow: 0 0 10px #00ffff; }
      }
      .rgb-border {
        animation: rgb-border 3s linear infinite;
      }

      /* Circuit Board Pattern Animation */
      @keyframes pulse-opacity {
        0%, 100% { opacity: 0.1; }
        50% { opacity: 0.3; }
      }
      .circuit-pattern {
        background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10 10 h80 v80 h-80 z M30 30 h40 v40 h-40 z' fill='none' stroke='white' stroke-width='0.5'/%3E%3Ccircle cx='10' cy='10' r='2' fill='white'/%3E%3Ccircle cx='90' cy='10' r='2' fill='white'/%3E%3Ccircle cx='90' cy='90' r='2' fill='white'/%3E%3Ccircle cx='10' cy='90' r='2' fill='white'/%3E%3C/svg%3E");
        animation: pulse-opacity 5s ease-in-out infinite;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
