
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TheKore Browser</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
        overflow: hidden;
      }
      .font-mono {
        font-family: 'JetBrains+Mono', monospace;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(155, 155, 155, 0.2);
        border-radius: 10px;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      @keyframes rgb-border {
        0% { border-color: #00ffff; box-shadow: 0 0 10px #00ffff33; }
        33% { border-color: #ff00ff; box-shadow: 0 0 10px #ff00ff33; }
        66% { border-color: #ffff00; box-shadow: 0 0 10px #ffff0033; }
        100% { border-color: #00ffff; box-shadow: 0 0 10px #00ffff33; }
      }
      .rgb-border {
        animation: rgb-border 5s linear infinite;
      }
    </style>
